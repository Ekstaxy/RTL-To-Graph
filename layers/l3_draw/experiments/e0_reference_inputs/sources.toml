# Where reference block diagrams come from. Read by fetch.py.
#
# [[repo]]  images are taken from a git repo at `ref` (branch, tag or commit).
#   paths    regexes on the repo path; a file is a candidate if any matches
#   keywords regex on the file name (optional; fetch.py has a default); only matching
#            candidates are downloaded unless fetch.py is run with --all
# [[url]]   one file per entry, for vendor documents and papers picked by hand.
# [[arxiv]] the LaTeX source of a paper; every figure file in it is extracted.
#
# Textbook figures have no downloadable source: put screenshots in
# runs/e0_reference_inputs/refs/manual/ yourself. They stay out of the repo.

[[repo]]
name = "opentitan"
url = "https://github.com/lowRISC/opentitan"
ref = "master"
license = "Apache-2.0"
paths = ['^hw/.*/doc/.*', '^doc/.*']

[[repo]]
name = "ibex"
url = "https://github.com/lowRISC/ibex"
ref = "master"
license = "Apache-2.0"
paths = ['^doc/.*']

[[repo]]
name = "cva6"
url = "https://github.com/openhwgroup/cva6"
ref = "master"
license = "see repo LICENSE (GitHub reports no single SPDX id)"
paths = ['^docs/.*']

[[repo]]
name = "neorv32"
url = "https://github.com/stnolting/neorv32"
ref = "main"
license = "BSD-3-Clause"
paths = ['^docs/figures/.*']
keywords = 'cpu|processor|bus|system|ocd'

