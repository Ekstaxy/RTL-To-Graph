[project]
name = "rtl2d-l1"
version = "0.1.0"
description = "L1: RTL -> Selection (Stage 1 semantic anchor extraction)"
authors = [
    { name = "Ekstaxy", email = "ajchen0508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rtl2d-contracts",
    "pyslang>=12.0",
    "anthropic>=1.0",
    "pydantic>=2.6",
    "networkx>=3.2",
]

[project.optional-dependencies]
# LoRA distillation of the student model; install on the GPU box only
distill = ["torch", "transformers>=4.51", "peft>=0.13", "trl>=0.20", "datasets"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# prompt / taxonomy text is sent to the teacher verbatim; wrapping it changes the cached prompt
"src/rtl2d_l1/llm/prompt.py" = ["E501"]
"src/rtl2d_l1/taxonomy.py" = ["E501", "UP042"]
# (str, Enum) on purpose: StrEnum changes str()/format() output that is already in stored runs
"src/rtl2d_l1/frontend/graph.py" = ["UP042"]
