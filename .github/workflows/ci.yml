name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest
      # Enabled at bootstrap step 4:
      # - run: uv run rtl2d run corpus/pipe4 --fixture l1,l2
      # - run: uv run python -m rtl2d_contracts.export_schema && git diff --exit-code contracts/schemas
