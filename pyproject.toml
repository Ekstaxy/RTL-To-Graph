[project]
name = "rtl2diagram"
version = "0.1.0"
description = "RTL -> readable hardware architecture diagrams. Three-layer pipeline in one uv workspace."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "contracts",
    "layers/l1_extract",
    "layers/l2_spec",
    "layers/l3_draw",
    "pipeline",
    "eval",
]

[tool.uv.sources]
rtl2d-contracts = { workspace = true }
rtl2d-l1 = { workspace = true }
rtl2d-l2 = { workspace = true }
rtl2d-l3 = { workspace = true }
rtl2d-pipeline = { workspace = true }
rtl2d-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "contracts/tests",
    "layers/l1_extract/tests",
    "layers/l2_spec/tests",
    "layers/l3_draw/tests",
    "pipeline/tests",
    "eval/tests",
]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs", "corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
