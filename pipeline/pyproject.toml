[project]
name = "rtl2d-pipeline"
version = "0.1.0"
description = "Wires L1 -> L2 -> L3; provides the rtl2d command"
authors = [
    { name = "Ekstaxy", email = "ajchen0508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rtl2d-contracts",
    "rtl2d-l1",
    "rtl2d-l2",
    "rtl2d-l3",
    "rtl2d-eval",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
rtl2d = "rtl2d_pipeline.cli:main"
